# Interfaces whose *incoming* traffic is proxied (hotspot / tether clients).
# One interface prefix per line, '+' is a wildcard as in iptables.
# Lines starting with # are ignored.
#
# Do not add the uplink by default (wlan+, rmnet+): on this phone wlan0 is the
# upstream, and a rule that captures its ingress would also capture traffic that
# merely passes through. Add the real AP interface only if the phone shares the
# uplink interface with the hotspot, and check it while the hotspot is on.
allow ap+
allow swlan+
allow rndis+
allow ncm+
allow eth+
