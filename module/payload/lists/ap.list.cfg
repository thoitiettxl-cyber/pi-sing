# Interfaces whose *incoming* traffic is proxied (hotspot / tether clients).
# One interface prefix per line, '+' is a wildcard as in iptables.
# Lines starting with # are ignored.
#
# Do not add a blanket wlan+/rmnet+ here: on this phone wlan0 is the upstream,
# and a rule that captures its ingress would also capture traffic that merely
# passes through (on the dev container that is the host's own network).
# wlan1/wlan2 are listed on purpose: they are the hotspot on many ROMs (measured:
# wlan2 on this OPPO, 10.155.19.27/24). The parser skips an entry that matches
# the interface carrying the default route, so a phone whose uplink is wlan2
# cannot capture its own upstream.
allow ap+
allow swlan+
allow wlan1
allow wlan2
allow rndis+
allow ncm+
allow eth+
