# Pi-Sing per-app list -- sourced/parsed by pi.iptables with awk.
#
# mode: blacklist  -> every app is proxied, listed apps bypass the proxy
# mode: whitelist  -> only listed apps are proxied
# Must match proxy_mode in settings.ini.
mode: blacklist

# One entry per line. Accepted forms:
#   com.example.app        package of user 0
#   10:com.example.app     package of Android user 10
#   10123                  a raw uid (intentionally supports non-package uids)
# Lines starting with # are ignored.
#
# 0:com.termux
