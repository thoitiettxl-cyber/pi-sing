#!/system/bin/sh
# Pi-Sing settings -- sourced with /system/bin/sh by pi-sing and pi.iptables.
# POSIX sh only: `sh -n settings.ini` must pass.
# Only the values below are read by the module. Do not run this file.

# ---------------------------------------------------------------- service
# 1 = start sing-box at boot (service.sh), 0 = never auto start.
enabled=1

# Restart a dead process and refresh iptables when the default iface changes.
watchdog=1
watchdog_interval=30

# After start, probe one direct and one proxied request. If the rules break the
# direct path too, they are removed so the phone keeps its connection.
selftest=1

# ---------------------------------------------------------------- sing-box
# bin_name lives in bin_dir, config_file in config_dir.
bin_name="sing-box"
config_file="config.json"

# Log level written into config.json at start, so the core's own log stays
# readable: warn writes one line per connection, which is most of this module's
# disk writes. "config" (or empty) leaves config.json in charge.
core_log_level="warn"

# ------------------------------------------------------- transparent proxy
# Port of the sing-box tproxy inbound (must match "listen_port" in config.json;
# pi-sing rewrites it from this value on start).
tproxy_port=1536

# fwmark for packets captured by TPROXY, matched by the ip rule below.
fwmark="0x00200000/0x00200000"

# fwmark set by sing-box on its own outbound sockets (outbound "routing_mark"
# in config.json = 0x00400000). Traffic with this mark is never proxied again,
# which is what stops a redirect loop.
own_mark="0x00400000/0x00400000"
routing_mark=4194304

# Routing table id and ip rule preference used to deliver marked packets to lo.
table=2027
pref=110

# proxy = proxy IPv4 and IPv6 (ip6tables + ip -6 rule/route), no IPv6 leak
# block = IPv4 only; IPv6 is rejected in the filter table so it cannot leak
# off   = leave IPv6 alone (traffic leaves with the phone's own address: a leak)
# true/false are accepted as aliases of proxy/block.
ipv6="block"

# disable = block QUIC (UDP 443/80) in the filter table so apps fall back to TCP.
quic="disable"

# ------------------------------------------------------------ per-app proxy
# blacklist = every app is proxied except the ones listed in package.list.cfg
# whitelist = only the apps listed in package.list.cfg are proxied
proxy_mode="blacklist"

# Interfaces in ap.list.cfg are also proxied when traffic arrives on them
# (hotspot / tether clients). Output on ignore_interfaces is never proxied.
ignore_interfaces=""

# Incoming interfaces that must never be touched, matched in mangle PREROUTING
# before anything else. Droidspaces bridges/veths and the VM gateway stay out of
# the proxy: a container must not lose its link when the proxy is restarted.
bypass_interfaces="ds-br+ ds-v+ vgate0 dummy0"

# ------------------------------------------------------------ core process
# sing-box runs as core_user:core_group so its own traffic can be bypassed by
# gid in the mangle OUTPUT chain. net_admin = gid 3005 on Android.
core_user="root"
core_group="net_admin"
core_gid=3005

# ------------------------------------------------------------------- paths
# PISING_DIR can be overridden from the environment (tests only). Only this file
# sits at the top of the data dir; everything else lives in a subdirectory.
data_dir="${PISING_DIR:-/data/adb/pi-sing}"
bin_dir="${data_dir}/bin"
config_dir="${data_dir}/config"
list_dir="${data_dir}/lists"
run_dir="${data_dir}/run"
log_dir="${run_dir}/log"
uid_file="${run_dir}/appuid.list"
